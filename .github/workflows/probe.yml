name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          curl -s -L "https://t.me/s/deadlocknews" | grep -o 'tgme_widget_message_text[^>]*>[^<]\{0,160\}' | tail -6 > out.txt
          curl -s -L "https://t.me/s/deadlocknews" | grep -o 'tgme_channel_info_description">[^<]\{0,200\}' >> out.txt
          curl -s -L "https://t.me/s/deadlocknews" | grep -o 'counter_value">[^<]*' >> out.txt
          git config user.name probe; git config user.email probe@x; git add -A; git commit -qm out; git push
