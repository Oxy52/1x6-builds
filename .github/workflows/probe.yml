name: probe
on: push
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          id=$(curl -s https://api.opendota.com/api/proMatches | python3 -c "import json,sys;print(json.load(sys.stdin)[3]['match_id'])")
          curl -s https://api.opendota.com/api/matches/$id | gzip > pro.json.gz
          id2=$(curl -s https://api.opendota.com/api/publicMatches | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['match_id'])")
          curl -s https://api.opendota.com/api/matches/$id2 | gzip > pub.json.gz
          echo "$id $id2" > out.txt
          git config user.name p; git config user.email p@p; git add -A out.txt pro.json.gz pub.json.gz; git commit -m r; git push
