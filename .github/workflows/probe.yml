name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          {
          for n in dota2exe dota2_exe dotaexe dota_exe dota2exe_news dota2exenews exedota dota2dotexe dotaa2exe dota2_exe_news dota2exeru dota2exe_ru; do
            t=$(curl -s -L "https://t.me/s/$n" | grep -o '<meta property="og:title" content="[^"]*"' | head -1)
            c=$(curl -s -L "https://t.me/s/$n" | grep -c 'tgme_widget_message_wrap')
            echo "$n | $t | posts=$c"
          done
          } > out.txt 2>&1
          git config user.name probe; git config user.email probe@x; git add out.txt; git commit -qm out; git push
