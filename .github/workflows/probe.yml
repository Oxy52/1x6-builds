name: probe
on: push
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=sb_publishable_tJy3dl_kfNZXP6PXMqsQVQ_RUXqoPmn; U=https://vsmjjlrgjyujaioknlkn.supabase.co/rest/v1
          { echo "== list"; curl -s -G "$U/grids" --data-urlencode "select=id,name" --data-urlencode "data->>kind=is.null" --data-urlencode "limit=3" -H "apikey: $K" | head -c 300; echo
            echo "== cm"; curl -s -G "$U/grids" --data-urlencode "select=data->>g" --data-urlencode "data->>kind=eq.c" --data-urlencode "data->>g=in.(1,2)" -H "apikey: $K" | head -c 300; echo; } > out.txt
          git config user.name p; git config user.email p@p; git add -A out.txt; git commit -m r; git push
