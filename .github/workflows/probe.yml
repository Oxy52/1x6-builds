name: probe
on: push
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow -q
          curl -sL https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/agents.json -o ag.json
          curl -sL "https://api.deadlock-api.com/v1/assets/heroes?only_active=true" -o dl.json
          mkdir -p big/cs big/dl
          python3 - <<'PY' || true
          import json, urllib.request, io
          from PIL import Image
          log=[]
          def get(u):
              return Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()))
          def save(im,p):
              im=im.convert('RGBA'); bb=im.getchannel('A').getbbox(); im=im.crop(bb) if bb else im
              if im.height>720: im=im.resize((round(im.width*720/im.height),720),Image.LANCZOS)
              im.save(p,'WEBP',quality=82); return im.size
          a=json.load(open('ag.json')); seen=set(); n=0
          for x in a:
              nm=x['name'].split('|')[0].strip()
              if nm in seen: continue
              seen.add(nm)
              try:
                  im=get(x['image']); log.append(f"cs {n} {nm} {im.size} -> {save(im,f'big/cs/{n}.webp')}"); n+=1
              except Exception as e: log.append(f"cs err {nm} {e}")
              if n>=30: break
          d=json.load(open('dl.json')); n=0
          for h in d:
              im0=h.get('images',{}); best=None
              for k in ['hero_card_critical','hero_card_gloat','icon_hero_card','top_bar_vertical_image']:
                  u=im0.get(k)
                  if not u: continue
                  try:
                      im=get(u); log.append(f"  {h['name']} {k} {im.size} {im.mode}")
                      if best is None or im.size[0]*im.size[1]>best[1].size[0]*best[1].size[1]: best=(k,im)
                  except Exception as e: log.append(f"  err {k} {e}")
              if best: log.append(f"dl {n} {h['name']} {best[0]} -> {save(best[1],f'big/dl/{n}.webp')}"); n+=1
          open('out.txt','w').write('\n'.join(log))
          PY
          git config user.name p; git config user.email p@p; git add -A out.txt big; git commit -m r; git push
