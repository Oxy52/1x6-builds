name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          {
          for n in "Blades%20of%20Voth%20Domosh" "Fractal%20Horns%20of%20Inner%20Abysm" "Manifold%20Paradox"; do
          echo "== $n"
          curl -s -w "\nHTTP %{http_code}\n" "https://steamcommunity.com/market/listings/570/$n/render/?query=&start=0&count=4&country=US&language=english&currency=1" > r.json; tail -1 r.json; head -c 200 r.json; echo
          python3 -c "
          import json,re
          t=open('r.json').read().rsplit('\nHTTP',1)[0]
          d=json.loads(t)
          print('total', d.get('total_count'))
          for lid,l in list(d.get('listinginfo',{}).items())[:4]:
            a=l['asset']; ad=d['assets'][str(a['appid'])][a['contextid']][a['id']]
            print('price', l.get('converted_price'), l.get('converted_fee'), ad.get('name'))
            for x in ad.get('descriptions',[]):
              v=re.sub('<[^>]+>',' ',x.get('value',''))
              if v.strip(): print('   D:', v.strip()[:140], x.get('color',''))
          "
          sleep 3
          done
          } > out.txt 2>&1
          git config user.name probe; git config user.email probe@x; git add out.txt; git commit -qm out; git push
