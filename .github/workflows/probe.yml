name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          S=https://blazecrest.vercel.app/api/games
          {
          echo "== gems"; curl -s "$S?q=market&g=dota&cat=gem&start=0" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(i['n'],i.get('rn')) for i in d['items'][:4]]"
          echo "== ins arcana"; curl -s "$S?q=market&g=dota&cat=arcana&start=0&ql=ins" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['total']);[print(i['n']) for i in d['items'][:4]]"
          echo "== cs FN st"; curl -s "$S?q=market&g=cs&cat=rifle&start=0&ql=st" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['total']);[print(i['n']) for i in d['items'][:3]]"
          echo "== lots LC arcana"; curl -s "$S?q=lots&g=dota&s=Inscribed%20Blades%20of%20Voth%20Domosh" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total'),d.get('error'));[print(l['v'],[(g['n'],g['t']) for g in l['gems']],l['extra']) for l in d.get('items',[])[:5]]"
          echo "== lots cs"; curl -s "$S?q=lots&g=cs&s=AK-47%20%7C%20Redline%20(Field-Tested)" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total'),d.get('error'));[print(l['v'],l['gems'],l['extra']) for l in d.get('items',[])[:5]]"
          } > out.txt 2>&1
          git config user.name probe; git config user.email probe@x; git add out.txt; git commit -qm out; git push
