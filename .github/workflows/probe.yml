name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          for q in "g=cs&cat=rifle&start=0&sort=exp" "g=cs&cat=rifle&start=0&sort=cheap" "g=dota&cat=immortal&start=0" "g=cs&cat=knife&start=0"; do echo "== $q"; curl -s "https://blazecrest.vercel.app/api/games?q=market&$q" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(i['n'][:40],i.get('r'),i.get('rn'),[p['v'] for p in i['p']][:1]) for i in d.get('items',[])[:4]]"; done > out.txt 2>&1
          git config user.name probe; git config user.email probe@x; git add out.txt; git commit -qm out; git push
