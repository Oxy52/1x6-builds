name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          curl -s -L -H "Accept-Language: ru" "https://t.me/s/dota2_exe_news" > tg.html
          echo done > out.txt
          git config user.name probe; git config user.email probe@x; git add out.txt tg.html; git commit -qm out; git push
