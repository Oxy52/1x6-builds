name: probe
on: push
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/agents.json -o ag.json || true
          curl -sL "https://api.deadlock-api.com/v1/assets/heroes?only_active=true" -o dl.json || true
          python3 - <<'PY'
          import json
          a=json.load(open('ag.json')); out=['CS',str(len(a)),json.dumps(a[0])[:800]]
          d=json.load(open('dl.json')); out+=['DL',str(len(d)),json.dumps(d[0].get('images',{}))[:2500], d[0].get('name','')]
          open('out.txt','w').write('\n'.join(out))
          PY
          for u in $(python3 -c "import json;a=json.load(open('ag.json'));print(a[0]['image'])"); do curl -sL "$u" -o a0.png; done
          python3 -c "import json;d=json.load(open('dl.json'));[print(k,v) for k,v in d[0]['images'].items()]" | head -40 > imgs.txt
          for u in $(python3 -c "import json;d=json.load(open('dl.json'));im=d[0]['images'];print(' '.join(v for v in im.values() if isinstance(v,str) and v.endswith(('.png','.webp')) and 'webp' not in v)[:4000])"); do n=$(basename $u); curl -sL "$u" -o "x_$n"; done
          python3 -c "
          from PIL import Image;import glob
          for f in ['a0.png']+glob.glob('x_*'):
            try: im=Image.open(f); print(f,im.size,im.mode)
            except Exception as e: print(f,e)" >> out.txt || true
          git config user.name p; git config user.email p@p; git add out.txt imgs.txt; git commit -m r; git push
