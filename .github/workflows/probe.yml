name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          curl -s -H "Accept-Language: en" "https://steamcommunity.com/market/listings/730/AK-47%20%7C%20Redline%20%28Field-Tested%29" > page.html; curl -s -H "Accept-Language: en" "https://steamcommunity.com/market/listings/570/Exalted%20Fractal%20Horns%20of%20Inner%20Abysm" > page2.html; gzip -c page2.html > page2.html.gz
          {
          wc -c page.html
          grep -o 'g_rg[A-Za-z]*' page.html | sort | uniq -c
          grep -o 'Duels[^"<]\{0,60\}' page.html | head -5
          grep -o '"descriptions":\[[^]]\{0,400\}' page.html | head -3
          grep -o '<script[^>]*>[^<]\{0,80\}' page.html | head -20
          grep -o 'window\.[A-Za-z_]*\s*=' page.html | sort | uniq -c | head
          grep -o 'data-[a-z_-]*=' page.html | sort | uniq -c | sort -rn | head
          } > out.txt 2>&1
          gzip -c page.html > page.html.gz
          git config user.name probe; git config user.email probe@x; git add out.txt page.html.gz page2.html.gz; git commit -qm out; git push
