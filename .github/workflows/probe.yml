name: probe
on: push
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=sb_publishable_tJy3dl_kfNZXP6PXMqsQVQ_RUXqoPmn; U=https://vsmjjlrgjyujaioknlkn.supabase.co/rest/v1
          { for t in grids grid_likes news_posts posts feed_posts; do echo "== $t"; curl -s "$U/$t?select=*&limit=1" -H "apikey: $K" | head -c 300; echo; done; } > out.txt
          git config user.name p; git config user.email p@p; git add -A out.txt; git commit -m r; git push
