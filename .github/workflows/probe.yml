name: probe
on: { push: { branches: [probe] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe }
      - run: |
          set +e
          for c in dota cs deadlock; do echo "== $c"; curl -s "https://blazecrest.vercel.app/api/news?src=tg&ch=$c" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('items',[])),d.get('error'));[print(i['post'],i['cat'],i['t'][:70],bool(i['img'])) for i in d.get('items',[])[:4]]"; done > out.txt 2>&1
          git config user.name probe; git config user.email probe@x; git add -A; git commit -qm out; git push
